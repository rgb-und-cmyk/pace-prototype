<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pace — Set your goal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css?v=4">
<style>
  /* Focus visibility (non-negotiable) */
  a:focus-visible,
  button:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }

  /* Guard against a class-set `display` overriding the hidden attribute */
  [hidden] {
    display: none !important;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--space-lg);
  }

  .onboarding-shell {
    width: 100%;
    max-width: 480px;
  }

  /* Stepper + skip */
  .onboarding-topline {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-md);
    margin-bottom: var(--space-sm);
  }
  .stepper {
    display: flex;
    align-items: center;
    flex: 1;
    max-width: 220px;
  }
  .step-dot {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .step-dot--pending {
    border: 2px solid var(--color-border-mid);
    background-color: #FFFFFF;
    color: var(--color-text-sub);
  }
  .step-dot--active,
  .step-dot--done {
    border: 2px solid var(--color-accent);
    background-color: var(--color-accent);
    color: #FFFFFF;
  }
  .step-connector {
    flex: 1;
    height: 2px;
    background-color: var(--color-border-mid);
  }
  .step-connector--done {
    background-color: var(--color-accent);
  }
  .setup-skip {
    font-size: 13px;
    font-weight: 500;
    color: var(--color-text-mid);
    padding: 5px 10px;
    border-radius: var(--radius-md);
    flex-shrink: 0;
  }
  .setup-skip:hover {
    color: var(--color-accent);
    background-color: var(--color-accent-tint);
  }

  .step-position {
    font-size: 12px;
    font-weight: 600;
    color: var(--color-text-sub);
    margin: 0 0 var(--space-md);
  }

  .page-heading {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.2;
    color: var(--color-text);
    margin: 0 0 var(--space-lg);
  }

  /* Preset / custom toggle */
  .mode-toggle {
    display: inline-flex;
    gap: 2px;
    background-color: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: 2px;
    margin-bottom: var(--space-lg);
  }
  .mode-btn {
    background: none;
    border: none;
    border-radius: calc(var(--radius-md) - 2px);
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 500;
    color: var(--color-text-mid);
  }
  .mode-btn[aria-pressed="true"] {
    background-color: var(--color-accent);
    color: #FFFFFF;
    font-weight: 700;
  }

  fieldset {
    border: none;
    padding: 0;
    margin: 0;
    min-width: 0;
  }

  /* Goal cards (preset mode) */
  .goal-card {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 2px;
    width: 100%;
    text-align: left;
    border: 2px solid var(--color-border-mid);
    border-radius: var(--radius-md);
    padding: 14px 40px 14px 16px;
    margin-bottom: 8px;
    cursor: pointer;
    background-color: #FFFFFF;
  }
  .goal-card:hover {
    border-color: var(--color-text-mid);
  }
  .goal-card:focus-within {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }
  .goal-card--selected {
    border-color: var(--color-accent);
    background-color: var(--color-accent-tint);
  }
  .goal-card-input {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    margin: -1px;
  }
  .goal-card-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--color-text);
  }
  .goal-card--selected .goal-card-title {
    color: var(--color-accent);
  }
  .goal-card-subtitle {
    font-size: 12px;
    color: var(--color-text-sub);
  }
  .goal-card-check {
    position: absolute;
    top: 14px;
    right: 16px;
    color: var(--color-accent);
    font-weight: 700;
    display: none;
  }
  .goal-card--selected .goal-card-check {
    display: inline;
  }

  /* Custom mode */
  .form-field {
    margin-bottom: var(--space-md);
  }
  .form-field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--color-text);
    margin-bottom: 5px;
  }
  .form-field input[type="text"],
  .form-field input[type="number"] {
    width: 100%;
    padding: 10px 13px;
    border: 2px solid var(--color-border-mid);
    border-radius: var(--radius-md);
    font-size: 14px;
    color: var(--color-text);
    background-color: #FFFFFF;
    font-family: var(--font-sans);
    outline: none;
  }
  .form-field input:focus {
    border-color: var(--color-accent);
    box-shadow: 0 0 0 3px var(--color-accent-tint);
  }
  .form-field input::placeholder {
    color: var(--color-text-muted);
  }

  .metric-type-toggle {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .metric-type-btn {
    background-color: #FFFFFF;
    border: 2px solid var(--color-border-mid);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    color: var(--color-text);
  }
  .metric-type-btn:hover {
    border-color: var(--color-accent);
  }
  .metric-type-btn[aria-pressed="true"] {
    background-color: var(--color-accent);
    border-color: var(--color-accent);
    color: #FFFFFF;
  }
  .metric-value-wrap {
    margin-top: 10px;
  }
  .input-with-unit {
    position: relative;
  }
  .input-with-unit input {
    padding-right: 60px;
  }
  .input-with-unit .unit {
    position: absolute;
    right: 13px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    font-weight: 600;
    color: var(--color-text-muted);
    pointer-events: none;
  }

  .btn-primary {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    text-align: center;
    border-radius: var(--radius-md);
    padding: 12px 24px;
    font-size: 14px;
    font-family: var(--font-sans);
    background-color: var(--color-accent);
    color: #FFFFFF;
    border: 2px solid var(--color-accent);
    font-weight: 600;
    margin-top: var(--space-lg);
  }
  .btn-primary:hover {
    background-color: #5a4b7a;
    border-color: #5a4b7a;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  @media (prefers-reduced-motion: no-preference) {
    .btn-primary,
    .setup-skip,
    .goal-card,
    .mode-btn,
    .metric-type-btn,
    .form-field input {
      transition: background-color var(--transition), border-color var(--transition), box-shadow var(--transition), color var(--transition);
    }
  }

  @media (max-width: 480px) {
    .btn-primary,
    .setup-skip,
    .goal-card,
    .mode-btn,
    .metric-type-btn {
      min-height: 44px;
    }
    .form-field input {
      min-height: 44px;
    }
  }
</style>
</head>
<body>
  <main class="onboarding-shell">
    <div class="onboarding-topline">
      <div class="stepper" aria-hidden="true">
        <div class="step-dot step-dot--done">✓</div>
        <div class="step-connector step-connector--done"></div>
        <div class="step-dot step-dot--done">✓</div>
        <div class="step-connector step-connector--done"></div>
        <div class="step-dot step-dot--done">✓</div>
        <div class="step-connector step-connector--done"></div>
        <div class="step-dot step-dot--active">4</div>
        <div class="step-connector"></div>
        <div class="step-dot step-dot--pending">5</div>
      </div>
      <a class="setup-skip" href="../index.html">Skip setup</a>
    </div>
    <p class="step-position">Step 4 of 5 — Goal</p>

    <h1 class="page-heading">What are you working towards?</h1>

    <div class="mode-toggle" role="group" aria-label="Goal type">
      <button type="button" class="mode-btn" data-mode="preset" aria-pressed="true">Preset goals</button>
      <button type="button" class="mode-btn" data-mode="custom" aria-pressed="false">Custom goal</button>
    </div>

    <form id="goalForm">
      <div id="presetMode">
        <fieldset>
          <legend class="sr-only">Choose a goal</legend>

          <label class="goal-card goal-card--selected">
            <input class="goal-card-input" type="radio" name="presetGoal" value="consistency" checked>
            <span class="goal-card-title">Ride consistently</span>
            <span class="goal-card-subtitle">3 rides a week</span>
            <span class="goal-card-check" aria-hidden="true">✓</span>
          </label>

          <label class="goal-card">
            <input class="goal-card-input" type="radio" name="presetGoal" value="endurance">
            <span class="goal-card-title">Build endurance</span>
            <span class="goal-card-subtitle">Complete a 40km ride</span>
            <span class="goal-card-check" aria-hidden="true">✓</span>
          </label>

          <label class="goal-card">
            <input class="goal-card-input" type="radio" name="presetGoal" value="weight">
            <span class="goal-card-title">Lose weight</span>
            <span class="goal-card-check" aria-hidden="true">✓</span>
          </label>

          <label class="goal-card">
            <input class="goal-card-input" type="radio" name="presetGoal" value="explore">
            <span class="goal-card-title">Just explore</span>
            <span class="goal-card-subtitle">No specific metric goal</span>
            <span class="goal-card-check" aria-hidden="true">✓</span>
          </label>
        </fieldset>
      </div>

      <div id="customMode" hidden>
        <div class="form-field">
          <label for="customGoalText">Describe your goal</label>
          <input type="text" id="customGoalText" name="customGoalText" placeholder="e.g. Ride to the coast this summer">
        </div>
        <div class="form-field">
          <label id="metricLabel">Add a metric (optional)</label>
          <div class="metric-type-toggle" role="group" aria-labelledby="metricLabel">
            <button type="button" class="metric-type-btn" data-metric="distance" aria-pressed="false">Distance</button>
            <button type="button" class="metric-type-btn" data-metric="frequency" aria-pressed="false">Frequency</button>
            <button type="button" class="metric-type-btn" data-metric="weight" aria-pressed="false">Weight</button>
          </div>
          <div class="metric-value-wrap" id="metricValueWrap" hidden>
            <label for="metricValue" class="sr-only" id="metricValueLabel">Metric value</label>
            <div class="input-with-unit">
              <input type="number" id="metricValue" name="metricValue" min="1">
              <span class="unit" id="metricUnit" aria-hidden="true"></span>
            </div>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-primary">Save and continue</button>
    </form>
  </main>

  <script>
    (function () {
      var modeButtons = document.querySelectorAll('.mode-btn');
      var presetMode = document.getElementById('presetMode');
      var customMode = document.getElementById('customMode');
      var customGoalText = document.getElementById('customGoalText');
      var presetRadios = document.querySelectorAll('input[name="presetGoal"]');
      var metricButtons = document.querySelectorAll('.metric-type-btn');
      var metricValueWrap = document.getElementById('metricValueWrap');
      var metricValue = document.getElementById('metricValue');
      var metricUnit = document.getElementById('metricUnit');
      var metricValueLabel = document.getElementById('metricValueLabel');

      var metricUnits = {
        distance: { unit: 'km', label: 'Distance in kilometers' },
        frequency: { unit: 'x / wk', label: 'Rides per week' },
        weight: { unit: 'kg', label: 'Weight in kilograms' }
      };

      function setMode(mode) {
        modeButtons.forEach(function (btn) {
          btn.setAttribute('aria-pressed', btn.getAttribute('data-mode') === mode ? 'true' : 'false');
        });
        presetMode.hidden = mode !== 'preset';
        customMode.hidden = mode !== 'custom';
        customGoalText.required = mode === 'custom';
      }

      modeButtons.forEach(function (btn) {
        btn.addEventListener('click', function () { setMode(btn.getAttribute('data-mode')); });
      });

      presetRadios.forEach(function (radio) {
        radio.addEventListener('change', function () {
          presetRadios.forEach(function (r) {
            r.closest('.goal-card').classList.toggle('goal-card--selected', r.checked);
          });
        });
      });

      metricButtons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          var key = btn.getAttribute('data-metric');
          var alreadyActive = btn.getAttribute('aria-pressed') === 'true';
          metricButtons.forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });

          if (alreadyActive) {
            metricValueWrap.hidden = true;
            metricValue.value = '';
            return;
          }
          btn.setAttribute('aria-pressed', 'true');
          metricValueWrap.hidden = false;
          metricUnit.textContent = metricUnits[key].unit;
          metricValueLabel.textContent = metricUnits[key].label;
          metricValue.focus();
        });
      });

      document.getElementById('goalForm').addEventListener('submit', function (e) {
        e.preventDefault();
        window.location.href = 'body.html';
      });
    })();
  </script>
</body>
</html>
