<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pace — You're set</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css?v=4">
<style>
  /* Focus visibility (non-negotiable) */
  a:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--space-lg);
  }

  .onboarding-shell {
    width: 100%;
    max-width: 480px;
  }

  .confirm-badge {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background-color: var(--color-accent);
    color: #FFFFFF;
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 0 var(--space-md);
  }

  .page-heading {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.2;
    color: var(--color-text);
    margin: 0 0 8px;
  }
  .page-explainer {
    font-size: 13px;
    line-height: 1.5;
    color: var(--color-text-sub);
    margin: 0;
  }

  .summary-card {
    background-color: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: var(--space-md);
    margin: var(--space-lg) 0 var(--space-xl);
  }
  .summary-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: var(--space-sm);
    padding: 10px 0;
    border-bottom: 1px solid var(--color-border);
  }
  .summary-row:first-child {
    padding-top: 0;
  }
  .summary-row:last-child {
    border-bottom: none;
    padding-bottom: 0;
  }
  .summary-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--color-text-sub);
    flex-shrink: 0;
  }
  .summary-value {
    font-size: 13px;
    font-weight: 600;
    color: var(--color-text);
    text-align: right;
  }

  .btn-primary {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    text-align: center;
    border-radius: var(--radius-md);
    padding: 12px 24px;
    font-size: 14px;
    font-family: var(--font-sans);
    background-color: var(--color-accent);
    color: #FFFFFF;
    border: 2px solid var(--color-accent);
    font-weight: 600;
  }
  .btn-primary:hover {
    background-color: #5a4b7a;
    border-color: #5a4b7a;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  @media (prefers-reduced-motion: no-preference) {
    .btn-primary {
      transition: background-color var(--transition), border-color var(--transition);
    }
  }

  @media (max-width: 480px) {
    .btn-primary {
      min-height: 44px;
    }
  }
</style>
</head>
<body>
  <main class="onboarding-shell">
    <div class="confirm-badge" aria-hidden="true">✓</div>
    <h1 class="page-heading">You're ready to ride.</h1>
    <p class="page-explainer">Here's what we set up:</p>

    <div class="summary-card">
      <div class="summary-row">
        <span class="summary-label">Data source</span>
        <span class="summary-value">Garmin Connect</span>
      </div>
      <div class="summary-row">
        <span class="summary-label">Goal</span>
        <span class="summary-value">Ride consistently — 3 rides a week</span>
      </div>
      <div class="summary-row">
        <span class="summary-label">Body data</span>
        <span class="summary-value">Added</span>
      </div>
    </div>

    <p class="sr-only" id="confirmStatus" role="status" aria-live="polite"></p>

    <a class="btn-primary" href="../index.html">Go to my dashboard</a>
  </main>

  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        document.getElementById('confirmStatus').textContent = "Setup complete. You're ready to ride.";
      }, 150);
    });
  </script>
</body>
</html>
