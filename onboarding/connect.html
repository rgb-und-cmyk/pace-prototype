<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pace — Connect your data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css?v=4">
<style>
  /* Focus visibility (non-negotiable) */
  a:focus-visible,
  button:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }

  /* Guard against a class-set `display` overriding the hidden attribute */
  [hidden] {
    display: none !important;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--space-lg);
  }

  .onboarding-shell {
    width: 100%;
    max-width: 480px;
  }

  /* Stepper + skip */
  .onboarding-topline {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-md);
    margin-bottom: var(--space-sm);
  }
  .stepper {
    display: flex;
    align-items: center;
    flex: 1;
    max-width: 220px;
  }
  .step-dot {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .step-dot--pending {
    border: 2px solid var(--color-border-mid);
    background-color: #FFFFFF;
    color: var(--color-text-sub);
  }
  .step-dot--active,
  .step-dot--done {
    border: 2px solid var(--color-accent);
    background-color: var(--color-accent);
    color: #FFFFFF;
  }
  .step-connector {
    flex: 1;
    height: 2px;
    background-color: var(--color-border-mid);
  }
  .step-connector--done {
    background-color: var(--color-accent);
  }
  .setup-skip {
    font-size: 13px;
    font-weight: 500;
    color: var(--color-text-mid);
    padding: 5px 10px;
    border-radius: var(--radius-md);
    flex-shrink: 0;
  }
  .setup-skip:hover {
    color: var(--color-accent);
    background-color: var(--color-accent-tint);
  }

  .step-position {
    font-size: 12px;
    font-weight: 600;
    color: var(--color-text-sub);
    margin: 0 0 var(--space-md);
  }

  .page-heading {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.2;
    color: var(--color-text);
    margin: 0 0 var(--space-lg);
  }

  /* Data source tiles */
  .source-tile {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-sm);
    width: 100%;
    text-align: left;
    border: 2px solid var(--color-border-mid);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    background-color: #FFFFFF;
    margin-bottom: 8px;
    font-family: var(--font-sans);
  }
  .source-tile:hover {
    border-color: var(--color-text-mid);
  }
  .source-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--color-text);
  }
  .source-status {
    font-size: 13px;
    font-weight: 500;
    color: var(--color-text-sub);
    flex-shrink: 0;
  }
  .source-tile--connected {
    border-color: var(--color-accent);
    background-color: var(--color-accent-tint);
  }
  .source-tile--connected .source-name,
  .source-tile--connected .source-status {
    color: var(--color-accent);
    font-weight: 700;
  }

  .inline-error {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 13px;
    color: var(--color-negative);
    background-color: var(--color-negative-tint);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    margin: 4px 0 var(--space-md);
  }
  .link-btn {
    background: none;
    border: none;
    padding: 0;
    font-size: 13px;
    font-weight: 700;
    color: var(--color-negative);
    text-decoration: underline;
  }

  .btn-primary,
  .btn-secondary {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    text-align: center;
    border-radius: var(--radius-md);
    padding: 12px 24px;
    font-size: 14px;
    font-family: var(--font-sans);
  }
  .btn-primary {
    background-color: var(--color-accent);
    color: #FFFFFF;
    border: 2px solid var(--color-accent);
    font-weight: 600;
  }
  .btn-primary:hover {
    background-color: #5a4b7a;
    border-color: #5a4b7a;
  }
  .btn-secondary {
    background-color: #FFFFFF;
    color: var(--color-text);
    border: 2px solid var(--color-border-mid);
    font-weight: 500;
  }
  .btn-secondary:hover {
    border-color: var(--color-text-mid);
  }
  .continue-cta {
    margin-top: var(--space-lg);
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background-color: rgba(46, 46, 46, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--space-lg);
    z-index: 100;
  }
  .modal-dialog {
    position: relative;
    background-color: var(--color-surface);
    border-radius: var(--radius-lg);
    padding: var(--space-xl) var(--space-lg) var(--space-lg);
    max-width: 400px;
    width: 100%;
  }
  .modal-close {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: none;
    border: none;
    font-size: 18px;
    color: var(--color-text-sub);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-close:hover {
    background-color: var(--color-bg);
    color: var(--color-text);
  }
  .modal-eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--color-accent);
    margin: 0 0 8px;
  }
  .modal-heading {
    font-size: 16px;
    font-weight: 600;
    color: var(--color-text);
    margin: 0 0 var(--space-lg);
  }
  .permissions-list {
    list-style: none;
    margin: 0 0 var(--space-lg);
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .permissions-list li {
    font-size: 13px;
    color: var(--color-text-sub);
    padding-left: 20px;
    position: relative;
  }
  .permissions-list li::before {
    content: '✓';
    position: absolute;
    left: 0;
    color: var(--color-accent);
    font-weight: 700;
  }
  .modal-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .form-field {
    margin-bottom: var(--space-md);
  }
  .form-field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--color-text);
    margin-bottom: 5px;
  }
  .form-field input {
    width: 100%;
    padding: 10px 13px;
    border: 2px solid var(--color-border-mid);
    border-radius: var(--radius-md);
    font-size: 14px;
    color: var(--color-text);
    background-color: #FFFFFF;
    font-family: var(--font-sans);
    outline: none;
  }
  .form-field input:focus {
    border-color: var(--color-accent);
    box-shadow: 0 0 0 3px var(--color-accent-tint);
  }

  @media (prefers-reduced-motion: no-preference) {
    .btn-primary,
    .btn-secondary,
    .setup-skip,
    .source-tile,
    .form-field input,
    .modal-close {
      transition: background-color var(--transition), border-color var(--transition), box-shadow var(--transition), color var(--transition);
    }
  }

  @media (max-width: 480px) {
    .btn-primary,
    .btn-secondary,
    .setup-skip,
    .source-tile {
      min-height: 44px;
    }
    .form-field input {
      min-height: 44px;
    }
  }
</style>
</head>
<body>
  <main class="onboarding-shell">
    <div class="onboarding-topline">
      <div class="stepper" aria-hidden="true">
        <div class="step-dot step-dot--done">✓</div>
        <div class="step-connector step-connector--done"></div>
        <div class="step-dot step-dot--done">✓</div>
        <div class="step-connector step-connector--done"></div>
        <div class="step-dot step-dot--active">3</div>
        <div class="step-connector"></div>
        <div class="step-dot step-dot--pending">4</div>
        <div class="step-connector"></div>
        <div class="step-dot step-dot--pending">5</div>
      </div>
      <a class="setup-skip" href="../index.html">Skip setup</a>
    </div>
    <p class="step-position">Step 3 of 5 — Data source</p>

    <h1 class="page-heading">Where does your ride data live?</h1>

    <div id="sourceTiles">
      <button type="button" class="source-tile" data-provider="garmin" data-provider-name="Garmin Connect">
        <span class="source-name">Garmin Connect</span>
        <span class="source-status" data-status>Connect</span>
      </button>
      <button type="button" class="source-tile" data-provider="strava" data-provider-name="Strava">
        <span class="source-name">Strava</span>
        <span class="source-status" data-status>Connect</span>
      </button>
      <button type="button" class="source-tile" data-provider="both" data-provider-name="Garmin Connect and Strava">
        <span class="source-name">Both</span>
        <span class="source-status" data-status>Connect</span>
      </button>
    </div>

    <p class="inline-error" id="connectError" hidden>
      Couldn't connect — the request was denied.
      <button type="button" class="link-btn" id="retryConnect">Try again</button>
    </p>

    <p class="sr-only" id="connectStatus" role="status" aria-live="polite"></p>

    <a class="btn-primary continue-cta" href="goal.html">Continue</a>
  </main>

  <div class="modal-backdrop" id="oauthModal" hidden>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalHeading" id="modalDialog">
      <button type="button" class="modal-close" id="modalClose" aria-label="Cancel connection">×</button>

      <div id="loginScreen">
        <p class="modal-eyebrow">Connecting to <span class="modal-provider-name"></span></p>
        <h2 class="modal-heading" id="modalHeading">Log in to connect your account</h2>
        <form id="modalLoginForm">
          <div class="form-field">
            <label for="modalEmail">Email</label>
            <input type="email" id="modalEmail" required>
          </div>
          <div class="form-field">
            <label for="modalPassword">Password</label>
            <input type="password" id="modalPassword" required>
          </div>
          <button type="submit" class="btn-primary">Log in</button>
        </form>
      </div>

      <div id="permissionsScreen" hidden>
        <p class="modal-eyebrow">Connecting to <span class="modal-provider-name"></span></p>
        <h2 class="modal-heading">Pace wants to access your account</h2>
        <ul class="permissions-list">
          <li>Read your activity data</li>
          <li>Read your profile</li>
        </ul>
        <div class="modal-actions">
          <button type="button" class="btn-primary" id="allowBtn">Allow</button>
          <button type="button" class="btn-secondary" id="denyBtn">Deny</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var modal = document.getElementById('oauthModal');
      var modalDialog = document.getElementById('modalDialog');
      var loginScreen = document.getElementById('loginScreen');
      var permissionsScreen = document.getElementById('permissionsScreen');
      var loginForm = document.getElementById('modalLoginForm');
      var allowBtn = document.getElementById('allowBtn');
      var denyBtn = document.getElementById('denyBtn');
      var modalCloseBtn = document.getElementById('modalClose');
      var connectError = document.getElementById('connectError');
      var retryBtn = document.getElementById('retryConnect');
      var connectStatus = document.getElementById('connectStatus');
      var currentTile = null;

      function showLoginScreen() {
        loginScreen.hidden = false;
        permissionsScreen.hidden = true;
      }
      function showPermissionsScreen() {
        loginScreen.hidden = true;
        permissionsScreen.hidden = false;
      }

      function openModal(tile) {
        currentTile = tile;
        var providerName = tile.getAttribute('data-provider-name');
        document.querySelectorAll('.modal-provider-name').forEach(function (el) { el.textContent = providerName; });
        loginForm.reset();
        showLoginScreen();
        modal.hidden = false;
        document.addEventListener('keydown', handleModalKeydown);
        document.getElementById('modalEmail').focus();
      }

      function closeModal(returnFocus) {
        modal.hidden = true;
        document.removeEventListener('keydown', handleModalKeydown);
        if (returnFocus && currentTile) currentTile.focus();
      }

      function handleModalKeydown(e) {
        if (e.key === 'Escape') {
          closeModal(true);
          return;
        }
        if (e.key !== 'Tab') return;
        var focusable = Array.prototype.filter.call(
          modalDialog.querySelectorAll('button, input, [href]'),
          function (el) { return el.offsetParent !== null; }
        );
        if (!focusable.length) return;
        var first = focusable[0], last = focusable[focusable.length - 1];
        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault();
          first.focus();
        }
      }

      function setTileConnected(tile) {
        tile.classList.add('source-tile--connected');
        tile.querySelector('[data-status]').textContent = '✓ Connected';
      }

      function markConnected(tile) {
        var provider = tile.getAttribute('data-provider');
        if (provider === 'both') {
          document.querySelectorAll('.source-tile').forEach(setTileConnected);
        } else {
          setTileConnected(tile);
        }
        connectError.hidden = true;
        connectStatus.textContent = tile.getAttribute('data-provider-name') + ' connected.';
      }

      document.querySelectorAll('.source-tile').forEach(function (tile) {
        tile.addEventListener('click', function () { openModal(tile); });
      });

      loginForm.addEventListener('submit', function (e) {
        e.preventDefault();
        showPermissionsScreen();
        allowBtn.focus();
      });

      allowBtn.addEventListener('click', function () {
        markConnected(currentTile);
        closeModal(true);
      });

      denyBtn.addEventListener('click', function () {
        var providerName = currentTile.getAttribute('data-provider-name');
        closeModal(true);
        connectError.hidden = false;
        connectStatus.textContent = 'Connection to ' + providerName + ' failed.';
      });

      modalCloseBtn.addEventListener('click', function () { closeModal(true); });

      retryBtn.addEventListener('click', function () {
        connectError.hidden = true;
        if (currentTile) openModal(currentTile);
      });
    })();
  </script>
</body>
</html>
